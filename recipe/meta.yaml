{% set name = "django-guardian" %}
{% set version = "3.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d80b8ab86c28f92adef816996f4341fbea6790aa1f09006c5afc1ef0ea394871

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - wheel
    - pip
  run:
    - typing_extensions >=4.12.0
    - python >={{ python_min }}
    - django >=3.2

test:
  imports:
    - guardian
  commands:
    - pip check
    - DJANGO_SETTINGS_MODULE=guardian.testapp.testsettings pytest --pyargs guardian
  requires:
    - django-environ >=0.12.0
    - pip
    - pytest >=8.3.4
    - pytest-django >=4.9.0
    - python {{ python_min }}

about:
  home: https://github.com/django-guardian/django-guardian
  summary: Per object permissions for Django
  doc_url: https://django-guardian.readthedocs.io/
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - abraha2d
